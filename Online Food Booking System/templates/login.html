<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login • ReserV9</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/jpeg" href="/minilogo.jpeg" />
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-fuchsia-600 to-rose-600 text-white">
  <div class="max-w-md mx-auto py-16 px-4">
    <div class="bg-white/10 backdrop-blur rounded-xl p-6 shadow">
      <div class="flex items-center gap-3 mb-4">
        <img src="/logo.jpeg" class="h-8 w-8" />
        <h1 class="text-xl font-semibold">Welcome back</h1>
      </div>
      <div class="space-y-3">
        <input id="email" type="email" placeholder="Email"
          class="w-full px-3 py-2 rounded bg-white/20 placeholder-white/70" />
        <input id="password" type="password" placeholder="Password"
          class="w-full px-3 py-2 rounded bg-white/20 placeholder-white/70" />
        <button id="loginBtn" class="w-full bg-white text-indigo-700 rounded px-3 py-2 font-medium">Login</button>
        <p class="text-sm text-white/80">New here? <a href="/signup" class="underline">Create an account</a></p>
      </div>
    </div>
  </div>
  <script src="/static/js/login.js"></script>
</body>

</html>
