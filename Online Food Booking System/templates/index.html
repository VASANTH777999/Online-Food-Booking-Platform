<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReserV9 • Facility & Restaurant Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/jpeg" href="/minilogo.jpeg" />
</head>

<body class="bg-slate-50 text-slate-800">
  <header class="sticky top-0 bg-gradient-to-r from-indigo-600 via-fuchsia-600 to-rose-600 text-white z-20">
    <div class="max-w-6xl mx-auto px-4 py-4 grid grid-cols-3 items-center">
      <div class="flex items-center gap-3">
        <img src="/logo.jpeg" alt="Logo" class="h-8 w-8" />
      </div>
      <div class="text-center">
        <h1 id="titleCenter" class="text-xl font-semibold">ReserV9</h1>
      </div>
      <nav class="ml-auto flex items-center gap-2 justify-end">
        <a href="/dashboard" class="bg-white text-indigo-700 px-3 py-2 rounded text-sm hover:bg-slate-100">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <section class="mt-6 mb-6">
      <div class="rounded-xl bg-gradient-to-r from-indigo-50 via-fuchsia-50 to-rose-50 border border-slate-200 p-6">
        <h2 class="text-2xl font-semibold mb-2">Discover and Book</h2>
        <p class="text-slate-600">Browse top restaurants and facilities. Search, filter, and book in seconds.</p>
      </div>
    </section>
    <section class="mb-6">
      <div class="flex items-center gap-3">
        <input id="searchInput" type="text" placeholder="Search by name or cuisine"
          class="flex-1 border rounded px-3 py-2" />
        <button id="refreshBtn" class="border px-3 py-2 rounded hover:bg-slate-100">Refresh</button>
        <button id="viewBookingsBtn" class="border px-3 py-2 rounded hover:bg-slate-100">View Bookings</button>
      </div>
      <div id="chips" class="mt-3 flex flex-wrap gap-2"></div>
    </section>

    <section>
      <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>
  </main>

  <div id="bookingsPanel" class="fixed inset-0 bg-black/40 hidden items-center justify-center">
    <div class="bg-white w-[90vw] max-w-2xl rounded shadow-lg p-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-semibold">Your Bookings</h2>
        <button id="closeBookings" class="text-slate-600">✕</button>
      </div>
      <div id="bookingsList" class="space-y-2"></div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>

</html>
